[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
]
ignore = [
  "E501", 
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", 
    "fastapi.Query", 
    "fastapi.Path", 
    "fastapi.Body"
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[project]
name = "tiny-url"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TihonERA", email = "miha311008@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aio-pika",
    "asyncpg",
    "fastapi>=0.143.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "ruff>=0.17.1",
    "sqlalchemy>=2.1.5",
]

[project.scripts]
tiny-url = "tiny_url:main"
